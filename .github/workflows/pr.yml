# ────────────────────────────────────────────────────────────────────────────────
# One By Two — Pull Request Pipeline
# SRS section 9.2.1
#
# Trigger: pull_request to main
# Steps: checkout, setup, lint, test, emulator integration tests, build
# ────────────────────────────────────────────────────────────────────────────────
name: PR Pipeline

# TODO: Re-enable once Flutter/Firebase code setup is complete.
# on:
#   pull_request:
#     branches: [main]
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── PR title: Conventional Commits format ──────────────────────────────────
  # The PR title becomes the squash-merge commit message on main, so it must
  # follow Conventional Commits. Individual branch commits are checked locally
  # by lefthook (commit-msg hook) but are not enforced in CI because PRs are
  # squash-merged.
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|chore|docs|test|refactor|ci|build)(\([a-z0-9_-]+\))?!?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <subject>"
            echo "Types: feat, fix, chore, docs, test, refactor, ci, build"
            echo "Subject: imperative mood, lowercase, no trailing full stop, max 72 chars."
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"

  # ── Flutter: format, analyse, test ──────────────────────────────────────────
  flutter-checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          if ! command -v lcov >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y lcov
          fi
          TOTAL=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          if [ "$(echo "$TOTAL < 50.0" | bc -l)" -eq 1 ]; then
            echo "::error::Overall coverage ${TOTAL}% is below the 50% threshold (SRS section 5.7)."
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 14

  # ── Cloud Functions: lint, test ─────────────────────────────────────────────
  functions-checks:
    name: Cloud Functions Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  # ── Integration tests against Firebase Emulator Suite ───────────────────────
  # Enabled in PR #7 (phone-auth feature) which added integration_test/.
  integration-tests:
    name: Integration Tests (Emulator Suite)
    runs-on: ubuntu-latest
    needs: [flutter-checks, functions-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run integration tests with emulators
        run: |
          firebase emulators:exec \
            --only auth,firestore,functions,storage \
            "flutter test test/integration/ --timeout 300s && cd functions && npm run test:rules" \
            --project demo-onebytwo

      - name: Run simplified-debts canonical tests against emulator
        run: |
          if cd functions && npm run --silent test:canonical --if-present; then
            echo "Canonical tests passed."
          else
            echo "test:canonical script not yet defined — skipping."
          fi

  # ── Build (unsigned) — catch build errors early ─────────────────────────────
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: [flutter-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore google-services.json
        # ── Firebase config secret restoration ──
        # google-services.json is gitignored (contains API keys). It is stored as
        # a base64-encoded GitHub Actions secret. This step decodes and places it
        # where the Android Gradle plugin expects it.
        #
        # Secret: GOOGLE_SERVICES_JSON_BASE64
        # Created by: scripts/stores/upload-github-secrets.sh
        # Source file: android/app/google-services.json (local, gitignored)
        # Encoding: base64 (no line wraps)
        # Decoding: base64 -d (Linux) — Ubuntu runners use GNU coreutils.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > android/app/google-services.json

      - name: Build Android APK (debug, unsigned)
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (no signing)
    runs-on: macos-14
    needs: [flutter-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Restore GoogleService-Info.plist
        # ── Firebase config secret restoration ──
        # GoogleService-Info.plist is gitignored. Stored as base64 in secrets.
        #
        # Secret: GOOGLE_SERVICE_INFO_PLIST_BASE64
        # Created by: scripts/stores/upload-github-secrets.sh
        # Source file: ios/Runner/GoogleService-Info.plist (local, gitignored)
        # Encoding: base64 (no line wraps)
        # Decoding: base64 -D (macOS) — macOS runners use BSD base64 which
        #   requires -D (uppercase) for decode, unlike GNU -d (lowercase).
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" | base64 -D > ios/Runner/GoogleService-Info.plist

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign
