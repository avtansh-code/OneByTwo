# ────────────────────────────────────────────────────────────────────────────────
# One By Two — Pull Request Pipeline
# SRS section 9.2.1
#
# Trigger: pull_request to main
# Steps: checkout, setup, lint, test, emulator integration tests, build
# ────────────────────────────────────────────────────────────────────────────────
name: PR Pipeline

# TODO: Re-enable once Flutter/Firebase code setup is complete.
# on:
#   pull_request:
#     branches: [main]
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  # Detects which areas a PR touches so downstream jobs run only when relevant
  # files change, saving CI time. The workflow still triggers on every PR, so
  # each downstream job always reports its own check: a job skipped via its
  # `if:` reports "skipped", which the `pull-request` ruleset counts as passing
  # (a skipped required check does NOT block the merge). We deliberately do NOT
  # use a workflow-level `on.paths` filter, which would skip the whole workflow
  # and leave the required checks unreported (blocking the PR).
  #
  # On non-pull_request events (workflow_dispatch) the filter step is skipped
  # and every output defaults to 'true', so a manual run executes everything.
  # The downstream `if:` conditions also fail safe: if this job does not succeed
  # they run anyway (better to run all tests than to skip them silently).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter == 'true' || github.event_name != 'pull_request' }}
      functions: ${{ steps.filter.outputs.functions == 'true' || github.event_name != 'pull_request' }}
      rules: ${{ steps.filter.outputs.rules == 'true' || github.event_name != 'pull_request' }}
      android: ${{ steps.filter.outputs.android == 'true' || github.event_name != 'pull_request' }}
      ios: ${{ steps.filter.outputs.ios == 'true' || github.event_name != 'pull_request' }}
      ci: ${{ steps.filter.outputs.ci == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.fvmrc'
              - '.firebaserc'
            functions:
              - 'functions/**'
              - 'firebase.json'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
            android:
              - 'android/**'
            ios:
              - 'ios/**'
            ci:
              - '.github/workflows/**'

  # ── PR title: Conventional Commits format ──────────────────────────────────
  # The PR title becomes the squash-merge commit message on main, so it must
  # follow Conventional Commits. Individual branch commits are checked locally
  # by lefthook (commit-msg hook) but are not enforced in CI because PRs are
  # squash-merged.
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|chore|docs|test|refactor|ci|build)(\([a-z0-9_-]+\))?!?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <subject>"
            echo "Types: feat, fix, chore, docs, test, refactor, ci, build"
            echo "Subject: imperative mood, lowercase, no trailing full stop, max 72 chars."
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"

  # ── Flutter: format, analyse, test ──────────────────────────────────────────
  flutter-checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    needs: [changes]
    # Run when Flutter sources/tests/config or any workflow change; fail safe to
    # running if change-detection did not succeed.
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.flutter == 'true'
      || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Verify single Firebase project (Invariant 4)
        run: |
          PROJECT_COUNT=$(cat .firebaserc | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('projects',{})))")
          if [ "$PROJECT_COUNT" != "1" ]; then
            echo "::error::Invariant 4 violation: .firebaserc contains $PROJECT_COUNT projects (expected exactly 1)"
            exit 1
          fi
          echo "Invariant 4: Single Firebase project verified (.firebaserc has 1 project)"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # subosito/flutter-action already caches ~/.pub-cache keyed on
          # pubspec.lock, so no separate pub cache step is needed.
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          python3 - <<'PY'
          import sys
          lh = lf = 0
          with open("coverage/lcov.info") as f:
              for line in f:
                  if line.startswith("LH:"):
                      lh += int(line.split(":")[1])
                  elif line.startswith("LF:"):
                      lf += int(line.split(":")[1])
          pct = (lh * 100.0 / lf) if lf else 0.0
          print(f"Total coverage: {pct:.1f}%")
          if pct < 50.0:
              print(f"::error::Overall coverage {pct:.1f}% is below the 50% threshold (SRS section 5.7).")
              sys.exit(1)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 14

  # ── Accessibility gate: WCAG contrast + dynamic-type (DC-12) ─────────────────
  a11y-checks:
    name: Accessibility Gate (WCAG AA)
    runs-on: ubuntu-latest
    needs: [changes]
    # The named, blocking accessibility gate (DC-12 / issue #124): runs the
    # a11y-contrast + a11y-dynamic-type tagged families so a reviewer sees the
    # WCAG contrast pairings and the 2.0x dynamic-type / reduced-motion gates
    # pass or fail by name, separate from DC-13's golden job. No Firebase, no
    # emulator, no secrets — these are pure `flutter test` runs (04 §E).
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.flutter == 'true'
      || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Contrast + dynamic-type accessibility gate
        # The boolean OR selector runs BOTH tagged families. Repeated
        # `--tags a --tags b` is last-wins and would silently skip the first
        # family, so the `||` selector is required (see 04 §E).
        run: flutter test --tags "a11y-contrast || a11y-dynamic-type"

  # ── Cloud Functions: lint, test ─────────────────────────────────────────────
  functions-checks:
    name: Cloud Functions Lint & Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.functions == 'true'
      || needs.changes.outputs.ci == 'true')
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npx jest --coverage --coverageReporters=json-summary --coverageReporters=text --forceExit

      - name: Upload Functions coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
          retention-days: 14

  # ── Integration tests against Firebase Emulator Suite ───────────────────────
  # Enabled in PR #7 (phone-auth feature) which added integration_test/.
  integration-tests:
    name: Integration Tests (Emulator Suite)
    runs-on: ubuntu-latest
    needs: [changes, flutter-checks, functions-checks]
    # Run when Flutter, Functions, rules or workflow files change. Tolerates a
    # skipped flutter-checks / functions-checks (the changed area drives it) but
    # does not run if a prerequisite check actually failed.
    if: >-
      !cancelled()
      && needs.flutter-checks.result != 'failure'
      && needs.functions-checks.result != 'failure'
      && (needs.changes.result != 'success'
      || needs.changes.outputs.flutter == 'true'
      || needs.changes.outputs.functions == 'true'
      || needs.changes.outputs.rules == 'true'
      || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Build Cloud Functions
        # Required so the Functions emulator loads the compiled trigger
        # bundle from functions/lib/. Without this, registered triggers
        # (e.g. onExpenseWriteFriendship from PR #36) do not fire end-to-end
        # under firebase emulators:exec.
        run: cd functions && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.20.0

      - name: Run Firestore Security Rules tests (no functions loaded)
        # Runs the rules-test layer in a dedicated emulator session with
        # ONLY firestore + storage — explicitly NOT functions. The
        # @firebase/rules-unit-testing harness uses its own mock auth
        # tokens via testEnv.authenticatedContext(uid), so the Auth
        # emulator is not required either.
        #
        # Background (architect chore-D5 §2.7; surfaced on Linux for
        # the first time during PR #46 review CI):
        # When test:rules runs in the same emulator session that has
        # the onExpenseWriteFriendship / onSettlementWrite triggers
        # loaded, every write a rules test issues fires a trigger
        # callback against the parent friendship document, which holds
        # a transaction lock across the rules-test cleanup
        # (testEnv.clearFirestore() in afterEach), occasionally
        # producing a 409 "Transaction lock timeout". Running the
        # rules layer in its own clean emulator session removes the
        # trigger-interference vector entirely.
        run: |
          # RT2 (audit 02-test-suite-health.md 2.3): log step duration for
          # the emulator-dependent suites so runtime trends are monitorable.
          start=$(date +%s)
          set +e
          firebase emulators:exec \
            --only firestore,storage \
            "cd functions && npm run test:rules" \
            --project demo-onebytwo
          status=$?
          set -e
          duration=$(( $(date +%s) - start ))
          echo "RT2 step-duration: rules-tests=${duration}s (exit ${status})"
          echo "::notice title=CI step duration (rules-tests)::${duration}s"
          exit $status

      - name: Run Flutter + Cloud Functions integration tests with full emulators
        # Full emulator session with auth + functions loaded so the
        # registered triggers fire end-to-end during the integration
        # tests' write paths.
        run: |
          # RT2: log step duration for the full-emulator integration suite.
          start=$(date +%s)
          set +e
          firebase emulators:exec \
            --only auth,firestore,functions,storage \
            "flutter test test/integration/ --timeout 300s \
             && cd functions \
             && npm run test:integration" \
            --project demo-onebytwo
          status=$?
          set -e
          duration=$(( $(date +%s) - start ))
          echo "RT2 step-duration: integration-tests=${duration}s (exit ${status})"
          echo "::notice title=CI step duration (integration-tests)::${duration}s"
          exit $status

      - name: Run simplified-debts canonical tests against emulator
        run: |
          # RT2: log step duration for the canonical simplified-debts suite.
          # test:canonical is defined (PR #59), so a non-zero run must fail
          # the job; preserve the exit status rather than swallowing it
          # behind --if-present / an else "skipping" branch.
          start=$(date +%s)
          set +e
          cd functions && npm run --silent test:canonical
          status=$?
          set -e
          duration=$(( $(date +%s) - start ))
          echo "RT2 step-duration: canonical-tests=${duration}s (exit ${status})"
          echo "::notice title=CI step duration (canonical-tests)::${duration}s"
          exit $status

  # ── Build (unsigned) — catch build errors early ─────────────────────────────
  # The build jobs intentionally do NOT depend on flutter-checks: they run in
  # parallel with lint/test from the start of the pipeline to minimise
  # wall-clock time. The trade-off is that a build may run even when
  # flutter-checks fails; concurrency.cancel-in-progress cancels superseded runs
  # when a new commit is pushed.
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.flutter == 'true'
      || needs.changes.outputs.android == 'true'
      || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore google-services.json
        # ── Firebase config secret restoration ──
        # google-services.json is gitignored (contains API keys). It is stored as
        # a base64-encoded GitHub Actions secret. This step decodes and places it
        # where the Android Gradle plugin expects it.
        #
        # Secret: GOOGLE_SERVICES_JSON_BASE64
        # Created by: scripts/stores/upload-github-secrets.sh
        # Source file: android/app/google-services.json (local, gitignored)
        # Encoding: base64 (no line wraps)
        # Decoding: base64 -d (Linux) — Ubuntu runners use GNU coreutils.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > android/app/google-services.json

      - name: Build Android APK (debug, unsigned)
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (no signing)
    # Standard (free) Apple-silicon runner. Do NOT switch to a larger runner
    # (macos-15-large / -xlarge): those are billed even on public repos, where
    # this standard runner is free.
    runs-on: macos-15
    needs: [changes]
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.flutter == 'true'
      || needs.changes.outputs.ios == 'true'
      || needs.changes.outputs.ci == 'true')
    env:
      # Pinned so the version-checked guard on the activation step below can
      # detect a cache hit (flutterfire_cli restored via subosito's pub cache)
      # and skip the slow from-source compile on a warm cache.
      FLUTTERFIRE_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # subosito/flutter-action caches ~/.pub-cache (keyed on pubspec.lock),
          # which also preserves the globally-activated flutterfire_cli snapshot,
          # so the activation step below is skipped on a warm cache.
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager (Firebase iOS SDK workaround)
        # Flutter 3.44 enabled SwiftPM by default for iOS plugins, but
        # FlutterFire CLI's `upload-crashlytics-symbols` build phase still
        # looks for the Crashlytics `run` script at the CocoaPods location
        # (`Pods/FirebaseCrashlytics/...`). Under SwiftPM the script moves
        # to `SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run`,
        # so the build phase fails with `ProcessException: No such file
        # or directory`. Reverting to CocoaPods is the documented workaround
        # until FlutterFire 2.x ships full SwiftPM support.
        run: flutter config --no-enable-swift-package-manager

      - name: Install FlutterFire CLI (cached)
        # The Xcode "upload-crashlytics-symbols" build phase invokes the
        # `flutterfire` binary, so the CLI is required for `flutter build ios`.
        # Activation compiles the CLI from source (slow, ~2-4 min); skip it when
        # the globally-activated snapshot has already been restored via the
        # subosito/flutter-action pub cache above (common case: unchanged
        # pubspec.lock). The version check (not a mere existence check) ensures a
        # FLUTTERFIRE_VERSION bump still triggers re-activation.
        run: |
          if dart pub global list 2>/dev/null | grep -q "flutterfire_cli ${FLUTTERFIRE_VERSION}"; then
            echo "flutterfire_cli ${FLUTTERFIRE_VERSION} restored from cache; skipping activation."
          else
            dart pub global activate flutterfire_cli "$FLUTTERFIRE_VERSION"
          fi

      - name: Restore GoogleService-Info.plist
        # ── Firebase config secret restoration ──
        # GoogleService-Info.plist is gitignored. Stored as base64 in secrets.
        #
        # Secret: GOOGLE_SERVICE_INFO_PLIST_BASE64
        # Created by: scripts/stores/upload-github-secrets.sh
        # Source file: ios/Runner/GoogleService-Info.plist (local, gitignored)
        # Encoding: base64 (no line wraps)
        # Decoding: base64 -D (macOS) — macOS runners use BSD base64 which
        #   requires -D (uppercase) for decode, unlike GNU -d (lowercase).
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICE_INFO_PLIST_BASE64}" | base64 -D > ios/Runner/GoogleService-Info.plist

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign

  # ── Coverage Gate — authoritative SRS 5.7 enforcement ────────────────────
  # Runs after test jobs complete. Checks per-feature/per-module thresholds
  # (>= 70%) and overall thresholds (>= 50%), and emits an advisory
  # simplified-debts branch metric; the canonical test matrix is authoritative.
  # This is a required status check on main.
  coverage-gate:
    name: Coverage Gate (SRS 5.7)
    runs-on: ubuntu-latest
    needs: [flutter-checks, functions-checks]
    # Runs only the coverage areas that actually ran. Skipped entirely when a
    # change touched neither Flutter nor Functions (e.g. docs-only) — a skipped
    # required check passes the ruleset. Each download step is guarded on its
    # job's success and the enforcement script tolerates a missing area.
    if: >-
      !cancelled()
      && (needs.flutter-checks.result == 'success'
      || needs.functions-checks.result == 'success')
    steps:
      # Coverage data is produced once upstream — flutter-checks emits
      # coverage/lcov.info and functions-checks emits
      # functions/coverage/coverage-summary.json — and uploaded as artifacts.
      # This job downloads them and enforces the SRS 5.7 thresholds without
      # re-running any tests.
      - name: Download Flutter coverage
        if: needs.flutter-checks.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: coverage

      - name: Download Functions coverage
        if: needs.functions-checks.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage

      - name: Enforce coverage thresholds
        run: |
          python3 << 'COVERAGE_SCRIPT'
          import io, json, os, re, sys

          failed = False
          results = []

          # ── Flutter coverage from coverage/lcov.info ──
          # Absent when flutter-checks was skipped (no Flutter change in the PR);
          # skip the Flutter gate in that case rather than failing.
          lcov_path = "coverage/lcov.info"
          flutter_present = os.path.exists(lcov_path)
          if not flutter_present:
              print("::notice::Flutter coverage absent (flutter-checks did not run); skipping Flutter coverage gate.")

          # Parse lcov.info into per-file (hit, total) counts
          file_coverage = {}  # filepath -> (lines_hit, lines_found)
          current_file = None
          lh = 0
          lf = 0
          with (open(lcov_path) if flutter_present else io.StringIO("")) as f:
              for line in f:
                  line = line.strip()
                  if line.startswith("SF:"):
                      current_file = line[3:]
                  elif line.startswith("LH:"):
                      lh = int(line.split(":")[1])
                  elif line.startswith("LF:"):
                      lf = int(line.split(":")[1])
                  elif line == "end_of_record":
                      if current_file:
                          file_coverage[current_file] = (lh, lf)
                      current_file = None
                      lh = 0
                      lf = 0

          # Discover Flutter feature folders from lcov data
          flutter_features = set()
          for fp in file_coverage:
              m = re.search(r"lib/features/([^/]+)/", fp)
              if m:
                  flutter_features.add(m.group(1))

          # Per-feature checks (>= 70%)
          total_hit_all = 0
          total_found_all = 0
          for feature in sorted(flutter_features):
              hit = 0
              found = 0
              for fp, (h, f) in file_coverage.items():
                  if f"lib/features/{feature}/" in fp:
                      hit += h
                      found += f
              pct = (hit * 100.0 / found) if found > 0 else 0.0
              status = "PASS" if pct >= 70.0 else "FAIL"
              results.append(("lib/features/" + feature + "/", f"{pct:.1f}%", ">= 70%", status))
              if pct < 70.0:
                  print(f"::error::lib/features/{feature}/ coverage is {pct:.1f}% (required >= 70%)")
                  failed = True

          # Overall Flutter coverage (>= 50%)
          if flutter_present:
              for fp, (h, f) in file_coverage.items():
                  total_hit_all += h
                  total_found_all += f
              overall_flutter = (total_hit_all * 100.0 / total_found_all) if total_found_all > 0 else 0.0
              status = "PASS" if overall_flutter >= 50.0 else "FAIL"
              results.append(("Overall Flutter", f"{overall_flutter:.1f}%", ">= 50%", status))
              if overall_flutter < 50.0:
                  print(f"::error::Overall Flutter coverage is {overall_flutter:.1f}% (required >= 50%)")
                  failed = True

          # ── Functions coverage from functions/coverage/coverage-summary.json ──
          # Absent when functions-checks was skipped (no Functions change); skip
          # the Functions gate in that case rather than failing.
          fn_summary_path = "functions/coverage/coverage-summary.json"
          functions_present = os.path.exists(fn_summary_path)
          if not functions_present:
              print("::notice::Functions coverage absent (functions-checks did not run); skipping Functions coverage gate.")

          fn_data = {}
          if functions_present:
              with open(fn_summary_path) as f:
                  fn_data = json.load(f)

          # Discover modules from keys like "functions/src/<module>/..."
          fn_modules = {}  # module -> {hit, total}
          fn_total_hit = 0
          fn_total_found = 0
          sd_branch_pct = None  # simplified-debts branch coverage

          for filepath, metrics in fn_data.items():
              if filepath == "total":
                  continue
              m = re.search(r"src/([^/]+)/", filepath)
              if m:
                  module = m.group(1)
                  lines = metrics.get("lines", {})
                  h = lines.get("covered", 0)
                  t = lines.get("total", 0)
                  if module not in fn_modules:
                      fn_modules[module] = {"hit": 0, "total": 0, "branch_covered": 0, "branch_total": 0}
                  fn_modules[module]["hit"] += h
                  fn_modules[module]["total"] += t
                  # Track branch coverage for simplified-debts
                  branches = metrics.get("branches", {})
                  fn_modules[module]["branch_covered"] += branches.get("covered", 0)
                  fn_modules[module]["branch_total"] += branches.get("total", 0)
                  fn_total_hit += h
                  fn_total_found += t

          # Per-module checks (>= 70%)
          for module in sorted(fn_modules):
              data = fn_modules[module]
              pct = (data["hit"] * 100.0 / data["total"]) if data["total"] > 0 else 0.0
              status = "PASS" if pct >= 70.0 else "FAIL"
              results.append((f"functions/src/{module}/", f"{pct:.1f}%", ">= 70%", status))
              if pct < 70.0:
                  print(f"::error::functions/src/{module}/ coverage is {pct:.1f}% (required >= 70%)")
                  failed = True

              # Simplified-debts branch coverage is tracked as an advisory metric.
              # The canonical test matrix (npm run test:canonical in integration-tests
              # job) is the authoritative validation of algorithm coverage, not
              # Istanbul's branch counter which includes implicit branches from
              # nullish coalescing, short-circuits, and ternary expressions.
              if module == "simplified-debts":
                  bt = data["branch_total"]
                  bc = data["branch_covered"]
                  bpct = (bc * 100.0 / bt) if bt > 0 else 0.0
                  results.append((f"functions/src/{module}/ (branches)", f"{bpct:.1f}%", "advisory", "INFO"))

          # Overall Functions coverage (>= 50%)
          if functions_present:
              overall_fn = (fn_total_hit * 100.0 / fn_total_found) if fn_total_found > 0 else 0.0
              status = "PASS" if overall_fn >= 50.0 else "FAIL"
              results.append(("Overall Functions", f"{overall_fn:.1f}%", ">= 50%", status))
              if overall_fn < 50.0:
                  print(f"::error::Overall Functions coverage is {overall_fn:.1f}% (required >= 50%)")
                  failed = True

          # ── Summary table ──
          print("")
          print("Coverage Gate Results (SRS section 5.7)")
          print("=" * 70)
          print(f"{'Scope':<40} {'Actual':<10} {'Required':<10} {'Status'}")
          print("-" * 70)
          for scope, actual, required, st in results:
              marker = "PASS" if st == "PASS" else "FAIL"
              print(f"{scope:<40} {actual:<10} {required:<10} {marker}")
          print("=" * 70)

          if failed:
              print("")
              print("Coverage gate FAILED. Fix coverage before merging.")
              sys.exit(1)
          else:
              print("")
              print("Coverage gate PASSED. All thresholds met.")
          COVERAGE_SCRIPT
