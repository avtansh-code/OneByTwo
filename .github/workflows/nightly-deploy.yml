# ────────────────────────────────────────────────────────────────────────────────
# One By Two — Nightly Backend Sync (rules + indexes)
# SRS section 9.1 / 9.4 — single production project; deploy-drift prevention.
#
# Nightly, idempotent deploy of the DECLARATIVE backend — Firestore Security
# Rules + indexes and Storage Security Rules — to the single production project,
# so production can never silently drift behind the committed source of truth
# (issue #110). `main` is always CI-tested (pr.yml gates the rules tests at
# merge), so a scheduled deploy from `main` is safe.
#
# Cloud Functions are intentionally NOT deployed here — they ship via the tagged
# release pipeline (release.yml). This job is the lightweight, repeatable
# rules/indexes convergence only.
# ────────────────────────────────────────────────────────────────────────────────
name: Nightly Backend Sync

on:
  schedule:
    # 18:30 UTC = 00:00 IST (midnight in India; this is an India-only app, so a
    # low-traffic window). Cron is always evaluated in UTC.
    - cron: '30 18 * * *'
  # Allow an on-demand convergence run from the Actions tab.
  workflow_dispatch:

# Never overlap a nightly run with a release deploy or a previous nightly run
# (shared production target). Queue rather than cancel so a run is not dropped.
concurrency:
  group: firebase-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-rules-indexes:
    name: Deploy Firestore Rules/Indexes + Storage Rules
    runs-on: ubuntu-latest
    # Use the same gated environment as the release deploy so the production
    # service-account secret and the deployment audit trail are consistent.
    # NOTE (owner): for the scheduled run to deploy unattended, the
    # `production-firebase` environment must not require a manual reviewer; a
    # required reviewer would pause every nightly run awaiting approval. Rules +
    # indexes are declarative and `main` is always CI-tested, so an unattended
    # nightly convergence is the intended behaviour.
    environment:
      name: production-firebase
    steps:
      - uses: actions/checkout@v4

      - name: Verify single Firebase project (Invariant 4)
        run: |
          PROJECT_COUNT=$(cat .firebaserc | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('projects',{})))")
          if [ "$PROJECT_COUNT" != "1" ]; then
            echo "::error::Invariant 4 violation: .firebaserc contains $PROJECT_COUNT projects (expected exactly 1)"
            exit 1
          fi
          echo "Invariant 4: single Firebase project verified (.firebaserc has 1 project)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firestore rules + indexes and Storage rules
        # Declarative, idempotent re-deploy of the committed rulesets + indexes.
        # `storage` is included to close the deploy-drift gap from #110 (the
        # release pipeline historically deployed only firestore:rules,indexes).
        # Every firebase call pins --project (single production project,
        # Invariant 4); the block-second-firebase-project guard is satisfied.
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project onebytwo-avtanshgupta \
            --non-interactive
