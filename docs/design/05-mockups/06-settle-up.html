<!--
  One By Two — Settle Up Screen Mockup
  ==================================
  SRS Functional Requirements:
    FR-SE-01: Simplified debts as canonical view
    FR-SE-02: Deterministic algorithm
    FR-SE-03: Cloud Function writes simplifiedBalances (Invariant 2)
    FR-SE-04: Atomic recomputation on settlement
    FR-SE-05: Record settlement with pre-fill from simplified debts
    FR-SE-06: Real-time balance update post-settlement
    FR-SE-07: Settle Up CTA on every non-zero balance screen
    FR-SE-08: Settlement history per friend and per group

  Wireframe reference: docs/design/04-wireframes/settle-up-flow.md (Section 2)
  Design tokens reference: docs/design/02-design-system/tokens.md

  Extension point: IA-EXT-01 — UPI payment option slot is ABSENT in v1.0.
    Future dock point: payment-method selector between note field and
    "Record Settlement" button. See settle-up-flow.md section "Extension Points".
  Extension point: ARCH-EXT-01 — method field is 'manual' only in v1.0.
  Extension point: ARCH-EXT-06 — verificationStatus is 'unverified' only in v1.0.

  Invariant 1: All monetary values are integer paise internally.
    The "850.00" displayed here is the UI-layer conversion of 85000 paise.
  Invariant 2: simplifiedBalances is server-maintained, client-read-only.
    The suggestion card reads from simplifiedBalances; it never writes to it.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One By Two — Settle Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS (from docs/design/02-design-system/tokens.md)
     ============================================================ */
  :root {
    /* Colour — Light Theme (Section 1.1) */
    --primary:           #1F4E79;
    --primary-variant:   #2E86AB;
    --secondary:         #F4A261;
    --secondary-variant: #E08C4A;
    --success:           #2A9D8F;
    --danger:            #E76F51;
    --error:             #E76F51;
    --surface:           #FFFFFF;
    --surface-variant:   #F2F4F7;
    --background:        #F8F9FB;
    --on-primary:        #FFFFFF;
    --on-secondary:      #1A1A1A;
    --on-surface:        #1A1A1A;
    --on-background:     #1A1A1A;
    --outline:           #C4C9D1;
    --divider:           #E4E7EC;
    --disabled:          #B0B7C3;
    --text-primary:      #1A1A1A;
    --text-secondary:    #4B5563;
    --text-tertiary:     #9CA3AF;
    --text-on-primary:   #FFFFFF;
    --text-on-danger:    #FFFFFF;
    --balance-positive:  #2A9D8F;
    --balance-negative:  #E76F51;
    --balance-zero:      #6B7280;

    /* Typography (Section 2) */
    --font-primary: 'Inter', system-ui, -apple-system, sans-serif;

    /* Spacing (Section 3) — 4-point grid */
    --space-2:  2px;
    --space-4:  4px;
    --space-8:  8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;
    --space-64: 64px;

    /* Corner Radii (Section 4) */
    --radius-small:  8px;
    --radius-medium: 12px;
    --radius-large:  16px;
    --radius-xl:     24px;
    --radius-full:   9999px;

    /* Elevation (Section 5) — Light Mode */
    --elevation-0: none;
    --elevation-1: 0px 1px 4px rgba(0, 0, 0, 0.04);
    --elevation-2: 0px 2px 6px rgba(0, 0, 0, 0.06);
    --elevation-3: 0px 4px 12px rgba(0, 0, 0, 0.08);
    --elevation-4: 0px 8px 20px rgba(0, 0, 0, 0.10);
    --elevation-5: 0px 12px 28px rgba(0, 0, 0, 0.12);

    /* Motion (Section 6) */
    --motion-standard:    250ms ease-in-out;
    --motion-emphasised:  300ms cubic-bezier(0.2, 0, 0, 1);
    --motion-decelerated: 200ms ease-out;
    --motion-sharp:       150ms ease-out;
  }

  /* ============================================================
     RESET AND BASE
     ============================================================ */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 390px;
    min-height: 844px;
    font-family: var(--font-primary);
    background: var(--background);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ============================================================
     DEVICE FRAME (visual wrapper for mockup presentation)
     ============================================================ */
  .device-frame {
    width: 390px;
    min-height: 844px;
    background: var(--background);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ============================================================
     STATUS BAR (iOS-style decorative element)
     ============================================================ */
  .status-bar {
    height: 47px;
    background: var(--primary);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 var(--space-20);
    padding-bottom: 4px;
    flex-shrink: 0;
  }

  .status-bar__time {
    font-size: 15px;
    font-weight: 600;
    color: var(--on-primary);
    letter-spacing: 0;
  }

  .status-bar__icons {
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }

  .status-bar__icons span {
    font-size: 12px;
    color: var(--on-primary);
    font-weight: 500;
  }

  /* ============================================================
     OBTAppBar — App Bar (tokens.md: primary background, onPrimary text)
     ============================================================ */
  .app-bar {
    height: 56px;
    background: var(--primary);
    display: flex;
    align-items: center;
    padding: 0 var(--space-4);
    flex-shrink: 0;
  }

  .app-bar__back {
    /* Tap target: 48x48dp per SRS 5.6 */
    width: var(--space-48);
    height: var(--space-48);
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: var(--radius-full);
  }

  .app-bar__back-arrow {
    width: 24px;
    height: 24px;
    position: relative;
  }

  .app-bar__back-arrow::before {
    content: '';
    display: block;
    width: 12px;
    height: 12px;
    border-left: 2.5px solid var(--on-primary);
    border-bottom: 2.5px solid var(--on-primary);
    transform: rotate(45deg);
    position: absolute;
    top: 6px;
    left: 7px;
  }

  .app-bar__title {
    /* headlineLarge: SemiBold 600, 24sp, 1.25 line-height */
    font-size: 20px;
    font-weight: 600;
    color: var(--on-primary);
    letter-spacing: 0;
    line-height: 1.3;
    margin-left: var(--space-4);
  }

  /* ============================================================
     SCROLLABLE CONTENT AREA
     ============================================================ */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-24) var(--space-20);
    display: flex;
    flex-direction: column;
    gap: var(--space-24);
  }

  /* ============================================================
     RECIPIENT SECTION — Large avatar + name
     ============================================================ */
  .recipient {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-8);
    padding-top: var(--space-8);
  }

  .recipient__avatar {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-full);
    background: var(--primary-variant);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--on-primary);
    letter-spacing: -0.25px;
    /* elevation-1 for subtle lift */
    box-shadow: var(--elevation-2);
  }

  .recipient__name {
    /* titleLarge: SemiBold 600, 18sp */
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.33;
  }

  /* ============================================================
     SIMPLIFIED-DEBTS SUGGESTION CARD
     Based on OBTSettleUpCard from wireframe Section 2
     cornerRadiusLarge (24dp), elevation1
     ============================================================ */
  .suggestion-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: var(--space-24);
    box-shadow: var(--elevation-1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-16);
  }

  .suggestion-card__label {
    /* bodyMedium: Regular 400, 14sp */
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.43;
    text-align: center;
    letter-spacing: 0.15px;
  }

  .suggestion-card__amount {
    /* displayMedium: Bold 700, 28sp — used for large balance display */
    font-size: 32px;
    font-weight: 700;
    color: var(--danger);
    line-height: 1.21;
    letter-spacing: -0.25px;
  }

  .suggestion-card__flow {
    display: flex;
    align-items: center;
    gap: var(--space-16);
    padding: var(--space-8) 0;
  }

  .flow-person {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-4);
  }

  .flow-person__avatar {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--on-primary);
  }

  .flow-person__avatar--you {
    background: var(--primary);
  }

  .flow-person__avatar--recipient {
    background: var(--primary-variant);
  }

  .flow-person__name {
    /* labelMedium: Medium 500, 12sp */
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  .flow-arrow {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    color: var(--danger);
  }

  .flow-arrow__line {
    width: 48px;
    height: 2px;
    background: var(--danger);
    border-radius: 1px;
    position: relative;
  }

  .flow-arrow__head {
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid var(--danger);
  }

  /* ============================================================
     FORM FIELDS
     All inputs: surfaceVariant fill, outline border, radiusLarge
     Focused: primary border colour
     Min height: 48dp (SRS 5.6 tap target)
     ============================================================ */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
  }

  .form-group__label {
    /* titleSmall: Medium 500, 14sp */
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.43;
    letter-spacing: 0.1px;
  }

  .form-input {
    width: 100%;
    min-height: var(--space-48);
    padding: var(--space-12) var(--space-16);
    background: var(--surface-variant);
    border: 1.5px solid var(--outline);
    border-radius: var(--radius-large);
    font-family: var(--font-primary);
    font-size: 16px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.5;
    letter-spacing: 0.15px;
    outline: none;
    transition: border-color var(--motion-sharp);
  }

  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.1);
  }

  .form-input::placeholder {
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* Amount input — special styling for currency */
  .amount-input-wrapper {
    position: relative;
  }

  .amount-input-wrapper .form-input {
    padding-left: 40px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0;
  }

  .amount-input-wrapper__prefix {
    position: absolute;
    left: var(--space-16);
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-secondary);
    pointer-events: none;
  }

  /* Date input — with calendar icon */
  .date-input-wrapper {
    position: relative;
  }

  .date-input-wrapper .form-input {
    padding-right: 44px;
    cursor: pointer;
  }

  .date-input-wrapper__icon {
    position: absolute;
    right: var(--space-16);
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Calendar icon (pure CSS) */
  .calendar-icon {
    width: 20px;
    height: 20px;
    border: 2px solid var(--text-secondary);
    border-radius: 3px;
    position: relative;
  }

  .calendar-icon::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 2px;
    right: 2px;
    height: 1.5px;
    background: var(--text-secondary);
  }

  .calendar-icon::after {
    content: '';
    position: absolute;
    top: -5px;
    left: 3px;
    width: 2px;
    height: 6px;
    background: var(--text-secondary);
    border-radius: 1px;
    box-shadow: 8px 0 0 var(--text-secondary);
  }

  /* Note field — textarea variant */
  .form-textarea {
    width: 100%;
    min-height: 56px;
    padding: var(--space-12) var(--space-16);
    background: var(--surface-variant);
    border: 1.5px solid var(--outline);
    border-radius: var(--radius-large);
    font-family: var(--font-primary);
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.43;
    letter-spacing: 0.15px;
    outline: none;
    resize: none;
    transition: border-color var(--motion-sharp);
  }

  .form-textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.1);
  }

  .form-textarea::placeholder {
    color: var(--text-tertiary);
  }

  /* Optional label tag */
  .label-optional {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-tertiary);
    margin-left: var(--space-4);
  }

  /* ============================================================
     PRIMARY BUTTON — Record Settlement
     Full-width, primary colour, 48dp min height, radiusMedium (12dp)
     labelLarge: Medium 500, 14sp
     ============================================================ */
  .btn-primary {
    width: 100%;
    min-height: var(--space-48);
    padding: var(--space-12) var(--space-24);
    background: var(--primary);
    color: var(--text-on-primary);
    border: none;
    border-radius: var(--radius-medium);
    font-family: var(--font-primary);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.1px;
    line-height: 1.43;
    cursor: pointer;
    transition: background var(--motion-sharp), box-shadow var(--motion-sharp);
    box-shadow: var(--elevation-2);
  }

  .btn-primary:hover {
    background: #173D5F;
    box-shadow: var(--elevation-3);
  }

  .btn-primary:active {
    background: #12324E;
    box-shadow: var(--elevation-1);
    transform: scale(0.99);
  }

  /* ============================================================
     DISCLAIMER TEXT
     bodySmall: Regular 400, 12sp, tertiary colour
     ============================================================ */
  .disclaimer {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-tertiary);
    line-height: 1.33;
    letter-spacing: 0.2px;
    text-align: center;
    padding: 0 var(--space-16);
  }

  /* ============================================================
     BOTTOM SAFE AREA (iPhone home indicator region)
     ============================================================ */
  .safe-area-bottom {
    height: 34px;
    flex-shrink: 0;
    background: var(--background);
  }

  /* ============================================================
     ACCESSIBILITY: Focus-visible ring for keyboard navigation
     ============================================================ */
  *:focus-visible {
    outline: 3px solid var(--primary-variant);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="device-frame" role="main" aria-label="Settle Up screen">

    <!-- iOS Status Bar (decorative) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons">
        <span>&#9679;&#9679;&#9679;&#9679;</span>
        <span>&#9632;</span>
      </div>
    </div>

    <!-- OBTAppBar: "Settle Up" with back arrow -->
    <header class="app-bar" role="navigation" aria-label="Settle Up screen header">
      <button
        class="app-bar__back"
        aria-label="Go back"
        role="button"
        tabindex="0"
      >
        <div class="app-bar__back-arrow" aria-hidden="true"></div>
      </button>
      <h1 class="app-bar__title">Settle Up</h1>
    </header>

    <!-- Scrollable content -->
    <div class="content">

      <!-- Recipient section: large avatar + name -->
      <section class="recipient" aria-label="Settlement recipient">
        <div
          class="recipient__avatar"
          role="img"
          aria-label="Rahul's profile picture"
        >R</div>
        <span class="recipient__name">Rahul</span>
      </section>

      <!-- Simplified-debts suggestion card -->
      <!--
        FR-SE-01: simplifiedBalances used as canonical view
        FR-SE-05: Pre-filled from simplified-debts suggestion
        Invariant 2: Client reads simplifiedBalances; never writes
      -->
      <section class="suggestion-card" aria-label="Simplified debt suggestion">
        <p class="suggestion-card__label">Based on simplified debts, you owe Rahul</p>
        <!-- Invariant 1: Internally 85000 paise; displayed as rupees at UI layer -->
        <p class="suggestion-card__amount" aria-label="You owe 850 rupees">&#8377;850.00</p>
        <div class="suggestion-card__flow" aria-label="Payment direction: You pay Rahul">
          <div class="flow-person">
            <div class="flow-person__avatar flow-person__avatar--you" aria-hidden="true">Y</div>
            <span class="flow-person__name">You</span>
          </div>
          <div class="flow-arrow" aria-hidden="true">
            <div class="flow-arrow__line"></div>
            <div class="flow-arrow__head"></div>
          </div>
          <div class="flow-person">
            <div class="flow-person__avatar flow-person__avatar--recipient" aria-hidden="true">R</div>
            <span class="flow-person__name">Rahul</span>
          </div>
        </div>
      </section>

      <!-- Amount input — editable, pre-filled for partial settlement -->
      <!--
        FR-SE-05: Pre-filled with suggested amount; user may reduce for partial
        Validation: amount > 0, amount <= suggestedAmountPaise (85000)
      -->
      <div class="form-group">
        <label class="form-group__label" for="amount-input">Amount</label>
        <div class="amount-input-wrapper">
          <span class="amount-input-wrapper__prefix" aria-hidden="true">&#8377;</span>
          <input
            id="amount-input"
            class="form-input"
            type="text"
            inputmode="decimal"
            value="850.00"
            aria-label="Enter amount in rupees"
            role="textbox"
          >
        </div>
      </div>

      <!-- Date picker — defaults to today -->
      <div class="form-group">
        <label class="form-group__label" for="date-input">Date</label>
        <div class="date-input-wrapper">
          <input
            id="date-input"
            class="form-input"
            type="text"
            value="30 Apr 2026"
            readonly
            aria-label="Settlement date, 30 April 2026"
            role="button"
          >
          <div class="date-input-wrapper__icon" aria-hidden="true">
            <div class="calendar-icon"></div>
          </div>
        </div>
      </div>

      <!-- Note field — optional -->
      <div class="form-group">
        <label class="form-group__label" for="note-input">
          Note <span class="label-optional">(optional)</span>
        </label>
        <textarea
          id="note-input"
          class="form-textarea"
          placeholder="Add a note"
          maxlength="200"
          rows="2"
          aria-label="Add a note, optional"
        ></textarea>
      </div>

      <!--
        IA-EXT-01: UPI PAYMENT OPTION SLOT — ABSENT IN v1.0
        Future: A payment-method selector ("Record manually" / "Pay via UPI")
        will appear here, between the note field and the Record Settlement button.
        See docs/design/04-wireframes/settle-up-flow.md, Extension Points section.
        SRS section 12.3 (bullet 1) lists UPI as a future-version feature.
      -->

      <!-- Record Settlement button — primary CTA -->
      <!--
        FR-SE-04: Triggers recomputeSimplifiedBalances Cloud Function
        FR-SE-06: Real-time balance update after settlement
        ARCH-EXT-01: method field set to 'manual'
        ARCH-EXT-06: verificationStatus set to 'unverified'
      -->
      <button
        class="btn-primary"
        type="button"
        aria-label="Record settlement of 850 rupees to Rahul"
      >Record Settlement</button>

      <!-- Disclaimer — manual settlement notice -->
      <p class="disclaimer">
        This records a manual settlement. No money is transferred through the app.
      </p>

    </div><!-- /.content -->

    <!-- Bottom safe area for iPhone home indicator -->
    <div class="safe-area-bottom" aria-hidden="true"></div>

  </div><!-- /.device-frame -->
</body>
</html>
