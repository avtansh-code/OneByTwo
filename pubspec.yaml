name: onebytwo
description: >
  One By Two — India-focused expense-sharing mobile application.
  SRS: docs/OneByTwo_Requirements_Spec.md
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  app_settings: ^7.0.0 # Opens the OS app/notification settings screen for the AC-11 "Open Settings" CTA (native plugin; iOS platform 11.0, below the project's iOS 15 target)
  cloud_firestore: ^6.3.0 # Firestore database
  cloud_functions: ^6.3.2
  connectivity_plus: ^6.1.5 # Network connectivity detection (FR-PR-03 AC-10) — pinned to 6.x because 7.x requires iOS 17+ (uses NWPath.isUltraConstrained); the project Podfile targets iOS 15
  crypto: ^3.0.6 # SHA-256 hashing for phone number privacy
  device_info_plus: 12.3.0 # OS version + device model for Contact Support body (FR-PR-05). PINNED (no caret): 12.4.0 through the current 13.1.0 reference NSProcessInfo `isiOSAppOnVision` (guarded by `@available(iOS 26.1)`), a selector no current Xcode SDK declares, so they fail the CI iOS build. 12.3.0 is the last version without it.
  firebase_analytics: ^12.3.0 # Usage analytics (SRS 5.10)
  firebase_app_check: ^0.4.3 # API abuse protection
  firebase_auth: ^6.4.0 # Phone auth (SRS 4.1)
  firebase_core: ^4.7.0 # Firebase initialisation
  firebase_crashlytics: ^5.2.0 # Crash reporting (SRS 5.10)
  firebase_messaging: ^16.2.0 # Push notifications (FCM)
  firebase_remote_config: ^6.4.0 # Feature flags (ADR-0006)
  firebase_storage: ^13.3.0 # Receipt and avatar uploads
  fl_chart: ^1.2.0 # Donut chart for the FR-HD-03 monthly category breakdown (pure-Dart; no native pod)
  flutter:
    sdk: flutter
  flutter_contacts: ^2.2.2 # Device contacts for add-friend flow (ADR-0013); 2.2.x targets Flutter 3.44+/UISceneDelegate
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1 # State management (ADR-0004)
  google_fonts: ^6.2.1 # Bricolage Grotesque + Hanken Grotesk (03-foundation-plan.md §3)
  image_picker: ^1.1.2 # Profile photo selection (FR-AU-06)
  intl: ^0.20.2 # Localisation (SRS 5.9)
  package_info_plus: ^9.0.1 # App version + build for Contact Support body (FR-PR-05)
  riverpod_annotation: ^2.6.1 # Code-gen annotations
  share_plus: ^10.1.4 # System share sheet (Invariant 3)
  shared_preferences: ^2.5.5 # On-device key-value persistence behind the core KeyValueStore seam (cross-launch wasPermanentlyDenied + FR-SE-09 cooldown). Native plugin; iOS pod shared_preferences_foundation targets platform 13.0, below the project's iOS 15 target
  url_launcher: ^6.3.2 # mailto: launch for Contact Support (FR-PR-05 / FR-SH-03)

dev_dependencies:
  build_runner: ^2.4.14
  custom_lint: ^0.7.0
  fake_async: ^1.3.3 # Used by tests that simulate Timer / Future scheduling
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
