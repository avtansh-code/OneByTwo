name: onebytwo
description: >
  One By Two — India-focused expense-sharing mobile application.
  SRS: docs/OneByTwo_Requirements_Spec.md
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.3.0 # Firestore database
  crypto: ^3.0.6 # SHA-256 hashing for phone number privacy
  firebase_analytics: ^12.3.0 # Usage analytics (SRS 5.10)
  firebase_app_check: ^0.4.3 # API abuse protection
  firebase_auth: ^6.4.0 # Phone auth (SRS 4.1)
  firebase_core: ^4.7.0 # Firebase initialisation
  firebase_crashlytics: ^5.2.0 # Crash reporting (SRS 5.10)
  firebase_messaging: ^16.2.0 # Push notifications (FCM)
  firebase_remote_config: ^6.4.0 # Feature flags (ADR-0006)
  firebase_storage: ^13.3.0 # Receipt and avatar uploads
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1 # State management (ADR-0004)
  google_fonts: ^6.2.1 # Plus Jakarta Sans + Inter (tokens.md)
  image_picker: ^1.1.2 # Profile photo selection (FR-AU-06)
  intl: ^0.20.2 # Localisation (SRS 5.9)
  riverpod_annotation: ^2.6.1 # Code-gen annotations
  share_plus: ^10.1.4 # System share sheet (Invariant 3)

dev_dependencies:
  build_runner: ^2.4.14
  custom_lint: ^0.7.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
